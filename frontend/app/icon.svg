<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E2547"/>
      <stop offset="100%" stop-color="#0B1027"/>
    </radialGradient>
    <linearGradient id="tube" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C89A4B"/>
      <stop offset="100%" stop-color="#F0CE85"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="rgba(212,168,87,0.4)" stroke-width="2"/>
  <!-- faint stars -->
  <circle cx="14" cy="40" r="1.2" fill="#A8B2D1" opacity="0.55"/>
  <circle cx="24" cy="13" r="1" fill="#A8B2D1" opacity="0.5"/>
  <circle cx="54" cy="34" r="1" fill="#A8B2D1" opacity="0.45"/>
  <!-- the star being observed -->
  <circle cx="49" cy="15" r="3.2" fill="#F0CE85"/>
  <!-- telescope tube, aimed up-right at the star -->
  <g>
    <rect x="13" y="24.5" width="34" height="11" rx="5.5" fill="url(#tube)"
      transform="rotate(-33 30 30)"/>
    <!-- eyepiece nub at the lower-left end -->
    <rect x="8.5" y="27.5" width="7" height="7" rx="3.5" fill="#C89A4B"
      transform="rotate(-33 30 30)"/>
  </g>
  <!-- tripod -->
  <path d="M30 38 L22 54" stroke="#8A6B3F" stroke-width="4" stroke-linecap="round"/>
  <path d="M33 38 L41 54" stroke="#8A6B3F" stroke-width="4" stroke-linecap="round"/>
</svg>
